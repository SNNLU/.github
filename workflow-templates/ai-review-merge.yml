name: AI Review & Auto-Merge

# 审查与合并策略在组织级复用工作流里：SNNLU/.github/.github/workflows/ai-review-merge.yml
# 本仓库只保留调用者。改策略请去那个仓库改（一处生效，所有仓库同步）。
#
# permissions 必须覆盖被调用工作流所需权限，否则会在启动阶段直接 startup_failure：
#   复用工作流里"合并"需要 contents: write（只读会让 job 起不来）。
permissions:
  contents: write
  pull-requests: write

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  ai-review:
    uses: SNNLU/.github/.github/workflows/ai-review-merge.yml@main
    secrets: inherit
